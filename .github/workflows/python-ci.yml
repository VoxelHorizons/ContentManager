name: Python Content Manager CI
on:
  push:
    branches: [main, docs/content-manager-architecture-roadmap]
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Unit tests (headless, no Tk mainloop)
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q content_manager
